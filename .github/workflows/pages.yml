name: website (GitHub Pages)

# Publishes the project home page (site/) and the campaign dashboard to
# https://aisl-at-imperial-college-london.github.io/operAItor/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The live-demo button links to the Hugging Face Space named by the repository variable HF_SPACE.
on:
  push:
    branches: [main]
    paths: ["site/**", "benchmark_results/fault_campaign_dashboard.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}    # the live console, e.g. the self-hosted https://<machine>.<tailnet>.ts.net
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          mkdir -p _site/dashboard
          cp -r site/. _site/
          cp benchmark_results/fault_campaign_dashboard.html _site/dashboard/index.html
          url="$DEMO_URL"
          if [ -z "$url" ] && [ -n "$HF_SPACE" ]; then
            url="https://$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | tr '_.' '--').hf.space"
          fi
          if [ -n "$url" ]; then sed -i "s#__DEMO_URL__#$url#" _site/index.html; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
