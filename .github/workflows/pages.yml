name: website (GitHub Pages)

# Publishes the project home page (site/) and the campaign dashboard to
# https://aisl-at-imperial-college-london.github.io/operAItor/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The live-demo button links to the repository variable DEMO_URL, or to the Hugging Face Space named by HF_SPACE;
# with neither, .github/scripts/assemble_site.py removes it from the page.
on:
  push:
    branches: [main]
    paths: ["site/**", "benchmark_results/fault_campaign_dashboard.html", ".github/workflows/pages.yml", ".github/scripts/assemble_site.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}    # the live console, e.g. the self-hosted https://<machine>.<tailnet>.ts.net
          HF_SPACE: ${{ vars.HF_SPACE }}
        # copies site/ and the dashboard; fills in the live-demo button, or removes it when neither variable is set
        run: python3 .github/scripts/assemble_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
