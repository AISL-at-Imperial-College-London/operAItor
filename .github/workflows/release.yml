name: release

# Builds every way to get OperAItor and publishes them on a version tag:
#   git tag v1.1.0 && git push origin v1.1.0      (the tag must match operaitor/__init__.py __version__)
#   git tag v1.1.0-rc.1 && ...                     a test release: marked pre-release, never Docker 'latest' or PyPI
# - pip:     wheel + source archive (console bundled) -> GitHub release, and PyPI when PYPI_PUBLISH=1
# - Docker:  ghcr.io/aisl-at-imperial-college-london/operaitor:<version> and :latest
# - Windows: OperAItor-Setup-<version>.exe (per-user installer) and a portable zip
# - macOS:   OperAItor-<version>-macos-arm64.dmg; Linux: OperAItor-<version>-linux-x86_64.tar.gz (desktop.yml)
# Run it by hand (Actions -> release -> Run workflow) to build and test everything without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('operaitor/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # file-name label: the tag without its "v" (1.1.0-rc.2), so each release candidate has its own installer name
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "label=$v" >> "$GITHUB_OUTPUT"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              "v$v") echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
              "v$v"-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;   # e.g. v1.1.0-rc.1
              *) echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ $v (use v$v or v$v-rc.N)"; exit 1 ;;
            esac
          fi
      - run: pip install build==1.2.2.post1
      - run: python packaging/build_dist.py
      - name: smoke test of the wheel
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install -q dist/*.whl
          /tmp/w/bin/operaitor doctor
          /tmp/w/bin/operaitor serve --port 8011 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8011/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8011/ | grep -q 'id="root"'
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  desktop:
    # Windows installer + portable zip, macOS disk image, Linux archive: built and smoke-tested on each system
    needs: dist
    uses: ./.github/workflows/desktop.yml
    with:
      label: ${{ needs.dist.outputs.label }}

  docker:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/aisl-at-imperial-college-london/operaitor
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      - name: smoke test
        run: |
          docker run -d --name plant -p 7860:7860 "$IMAGE:$VERSION"
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:7860/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:7860/ | grep -q 'id="root"'
      - name: publish to GitHub Container Registry
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${GITHUB_REF_NAME#v}"                       # 1.1.0 or 1.1.0-rc.1
          docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          if [ "${{ needs.dist.outputs.prerelease }}" != "true" ]; then docker push "$IMAGE:latest"; fi

  pypi:
    needs: [dist, desktop, docker]
    if: github.ref_type == 'tag' && needs.dist.outputs.prerelease != 'true' && vars.PYPI_PUBLISH == '1'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: no PyPI token stored in GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [dist, desktop, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          prerelease: ${{ needs.dist.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Install
            - **Windows:** download `OperAItor-Setup-${{ needs.dist.outputs.label }}.exe`, run it, then start OperAItor from the Start menu.
              The app is new and not code-signed, so your browser and Windows ask you to confirm:
              Edge: **…** → **Keep** → **Show more** → **Keep anyway**; Chrome: **Keep** (until then the file is `Unconfirmed ….crdownload`);
              Firefox: **Allow download**; "Windows protected your PC": **More info** → **Run anyway**.
              No installer wanted? Unzip the `-windows-portable.zip` and run `OperAItor.exe`.
            - **macOS (Apple silicon, macOS 12+):** open `OperAItor-${{ needs.dist.outputs.label }}-macos-arm64.dmg` and drag
              OperAItor to Applications. The app is not notarised by Apple, so the first time macOS refuses to open it:
              choose **Done**, then **System Settings → Privacy & Security → Open Anyway** (on macOS 14 and earlier you can
              also right-click the app → **Open** → **Open**). OperAItor opens in your browser; stop it with
              **Quit OperAItor** in the console.
            - **Linux (x86-64; Ubuntu 22.04+, Debian 12+, Fedora 36+):** `tar -xzf OperAItor-${{ needs.dist.outputs.label }}-linux-x86_64.tar.gz`,
              then run `./OperAItor/OperAItor`. It opens in your browser; Ctrl+C (or **Quit OperAItor**) stops it.
            - **Docker:** `docker run -p 7860:7860 ghcr.io/aisl-at-imperial-college-london/operaitor:${{ github.ref_name }}` (without the leading `v`), then open http://localhost:7860
            - **Python 3.11+:** `pip install "operaitor-${{ needs.dist.outputs.version }}-py3-none-any.whl[llm]"` (or from PyPI when published), then `operaitor serve`
