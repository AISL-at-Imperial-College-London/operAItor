name: Feedback or idea
description: Something you would like OperAItor to do, or how it went when you used it.
title: "[feedback] "
labels: ["feedback", "beta"]
body:
  - type: textarea
    id: what
    attributes:
      label: Your feedback
      description: What you tried, what worked, what you missed or would change.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by the console's Feedback button (optional).
      render: text
  - type: checkboxes
    id: help
    attributes:
      label: Building it
      options:
        - label: I would like to help build this
