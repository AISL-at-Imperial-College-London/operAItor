[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operaitor"
version = "1.0.0"
description = "OperAItor: LLM operator agents for a simulated chemical plant (CSTR + distillation), with PCA fault detection, safety functions, a digital twin and ADMIT admissibility gates, served as a web console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AISL, Imperial College London" }]
keywords = ["process control", "fault detection", "digital twin", "LLM agents", "safety", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# LLM agents: Ollama (free, local), Groq / Gemini / OpenRouter / OpenAI / any OpenAI-compatible server.
llm = ["langchain-openai>=1.0", "langchain-ollama>=0.3", "python-dotenv>=1.0"]
# ADMIT admissibility gates as a validator, and the acetone plant ADMIT cartridge.
admit = ["admit-bench @ git+https://github.com/Refiant-Inc/admit-bench.git"]
# Regenerate the plant knowledge graph (operaitor/data/knowledge_graph/build_*.py).
kg = ["rdflib>=7"]
# Benchmark plots (loop tests).
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "websockets>=12", "operaitor[llm,bench]"]

[project.scripts]
operaitor = "operaitor.cli:main"

[project.urls]
Repository = "https://github.com/AISL-at-Imperial-College-London/operAItor"

[tool.setuptools.packages.find]
include = ["operaitor*"]

[tool.setuptools.package-data]
operaitor = [
    "data/*.json",
    "data/knowledge_graph/*",
    "benchmark/dashboard_template.html",
    "admit/cartridge/*.yaml",
    "admit/cartridge/*.jsonl",
    "server/web/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network and an OpenAI key (skipped by default)"]

[tool.coverage.run]
source = ["operaitor"]
omit = ["operaitor/data/knowledge_graph/build_*.py"]  # one-off graph generator; its output is tested

[tool.coverage.report]
skip_empty = true
