[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acetone-plant"
version = "1.0.0"
description = "Integrated CSTR + distillation plant simulator with PCA fault detection, safety functions and LLM recovery agents, served as a web console."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AISL, Imperial College London" }]
keywords = ["process control", "fault detection", "digital twin", "LLM agents", "safety", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# OpenAI models (gpt-5-nano by default) and .env support.
llm = ["langchain-openai>=1.0", "python-dotenv>=1.0"]
# Local models through a native Ollama server (any OpenAI-compatible server works with [llm]).
ollama = ["langchain-ollama>=0.2"]
# ADMIT admissibility gates as a validator, and the acetone-plant ADMIT cartridge.
admit = ["admit-bench @ git+https://github.com/Refiant-Inc/admit-bench.git"]
# Benchmark plots (loop tests).
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "websockets>=12", "acetone-plant[llm,bench]"]

[project.scripts]
acetone-plant = "acetone_plant.cli:main"

[project.urls]
Repository = "https://github.com/AISL-at-Imperial-College-London/acetone_reaction"

[tool.setuptools.packages.find]
include = ["acetone_plant*"]

[tool.setuptools.package-data]
acetone_plant = [
    "data/*.json",
    "data/knowledge_graph/*",
    "benchmark/dashboard_template.html",
    "admit/cartridge/*.yaml",
    "admit/cartridge/*.jsonl",
    "server/web/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network and an OpenAI key (skipped by default)"]
