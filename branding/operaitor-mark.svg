<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OperAItor">
  <!-- OperAItor mark: a control valve as drawn on a process diagram (P&ID): a bow-tie valve on a pipe, its stem
       and the instrument bubble that operates it. Process-generic, not tied to any chemical. The sparkle marks
       the AI operator. Use operaitor-favicon.svg (no sparkle, heavier lines) below 32 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b74ff"/>
      <stop offset="1" stop-color="#1238a8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 44 H20 M44 44 H55" stroke-width="4"/>
    <path d="M20 35 L32 44 L20 53 Z M44 35 L32 44 L44 53 Z" stroke-width="3.4"/>
    <path d="M32 44 V31" stroke-width="3.4"/>
    <circle cx="32" cy="21.5" r="9.5" stroke-width="3.4"/>
    <path d="M22.5 21.5 H41.5" stroke-width="2.6"/>
  </g>
  <path d="M51 7.5 l1.6 4.1 4.1 1.6 -4.1 1.6 -1.6 4.1 -1.6 -4.1 -4.1 -1.6 4.1 -1.6 z" fill="#ffd166"/>
</svg>
