  confidence_floor: 0.5
  allowed_modes:
  - normal
  - upset
  - emergency
  retry_safe: true
  description: 'START_SPARE: switch a pump train (tag = FEED, CSTR_OUTLET, REFLUX,
    DISTILLATE, BOTTOMS) to its standby pump'
  step_evidence_tags:
    verify_pump_failed:
    - PUMP-STATUS
- action: open_blowdown
  class: commit_costly
  reversibility: costly_to_undo
  required_params:
